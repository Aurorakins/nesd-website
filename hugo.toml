baseurl = "https://aurorakins.github.io/nesd-website/" # Configure URL. if using gh-pages https://github.com/<username>/hugo-universal-theme URL: https://<username>.github.io/hugo-universal-theme/
title = "New England Same Day"
theme = "hugo-universal-theme"
languageCode = "en-us"
# Site language. Available translations in the theme's `/i18n` directory.
defaultContentLanguage = "en"

# number of words of summarized post content (default 70)
summaryLength = 70

# not pluralize title pages by default
pluralizelisttitles = false

# No blog, so don't build tag/category/author pages
disableKinds = ["taxonomy", "term"]

[services]
    # Enable comments by entering your Disqus shortname
    [services.disqus]
        shortname = ""
    # Enable Google Analytics by entering your tracking code
    [services.googleAnalytics]
        id = ""

# Define the number of posts per page
[pagination]
    pagerSize = 10

# Main menu
[menu]
[[menu.main]]
    name       = "Home"
    url        = "/"
    weight     = 1

[[menu.main]]
    name       = "Services"
    identifier = "menu.services"
    url        = ""  # this URL is shown as an image in the Services dropdown; left blank until there is an NESD image
    weight     = 3

[[menu.main]]
    name       = "Dry Ice"
    identifier = "section.dryice"
    url        = ""
    weight     = 1
    parent     = "menu.services"
    post       = 1

[[menu.main]]
    name       = "Large Quantity Orders"
    url        = "/services/dry-ice/large-quantity-orders/"
    weight     = 1
    parent     = "section.dryice"

[[menu.main]]
    name       = "Small Quantity Orders"
    url        = "/services/dry-ice/small-quantity-orders/"
    weight     = 2
    parent     = "section.dryice"

[[menu.main]]
    name       = "Dry Ice Shipped"
    url        = "/services/dry-ice/dry-ice-shipped/"
    weight     = 3
    parent     = "section.dryice"

[[menu.main]]
    name       = "Medical Transport"
    identifier = "section.medicaltransport"
    url        = ""
    weight     = 2
    parent     = "menu.services"
    post       = 2

[[menu.main]]
    name       = "Lab Specimen Transport"
    url        = "/services/medical-transport/lab-specimen-transport/"
    weight     = 1
    parent     = "section.medicaltransport"







# FAQ menu entry removed until content/faq.md has real questions (the page is also set not to build).
# To bring it back: re-add a menu entry with url = "/faq/" and remove [build] from faq.md.

[[menu.main]]
    identifier = "contact"
    name       = "Contact"
    url        = "/contact/"
    weight     = 7


# Top bar social links menu

[[menu.topbar]]
    weight = 1
    name = "Phone"
    url = "tel:+18603280585"
    pre = "<i class='fas fa-2x fa-phone'></i>"

[[menu.topbar]]
    weight = 3
    name = "Facebook"
    url = "https://www.facebook.com/profile.php?id=61573879167663"
    pre = "<i class='fab fa-2x fa-facebook'></i>"

[[menu.topbar]]
    weight = 2
    name = "Email"
    url = "mailto:walter@newenglandsameday.com"
    pre = "<i class='fas fa-2x fa-envelope'></i>"

[params]
    author = "New England Same Day"
    defaultKeywords = ["New England Same Day", "NESD", "medical courier", "lab specimen transport", "specimen courier", "dry ice delivery", "same day delivery", "Wallingford CT", "Connecticut"]
    defaultDescription = "New England Same Day provides certified medical courier, lab specimen transport, and dry ice delivery services across the Northeast from Wallingford, Connecticut, 24/7 since 1998."

    # Social media
    facebook_site = "https://www.facebook.com/profile.php?id=61573879167663" # the Facebook handle of your site ('https://www.facebook.com/HANDLE')
    twitter_site = "" # the Twitter handle of your site (without the '@')
    default_sharing_image = "img/sharing-default.png"


    # Style options: default (light-blue), blue, green, marsala, pink, red, turquoise, violet
    style = "blue"


    about_us = "<p>NESD has been serving the medical community in the northeast region since 1998 with our home office located in Wallingford, Connecticut. Each of our certified couriers receive 5 days of hands-on training to ensure that your patients, their families, and the medical providers are receiving the best possible service and care. Each specimen is handled logistically. We scan each batch sheet and pack the specimens according to temperature. Every specimen is packed with care and delivered on time.</p>"
    copyright = "Copyright (c) 2026-2027, New England Same Day LLC; all rights reserved."

    # Format dates with Go's time formatting
    date_format = "January 2, 2006"

    dropdown_mouse_over = false

    disabled_logo = false
    logo_text = "New England Same Day"

    logo = "img/NESDLogo-SVG.svg"
    logo_small = "img/NESDLogo-SVG.svg"
    contact_url = "contact/"
    address = """<p class="text-uppercase"><strong>New England Same Day LLC</strong>
        <br>1127 S Broad St
        <br>Wallingford, CT
        <br>06492
        <br>
        <strong>Phone Number</strong>
        <br> +1 (860) 328-0585
      </p>
      """

# Map on the contact page (keyless Google Maps embed, see layouts/partials/map.html)
[params.map]
    enable = true
    query = "New England Same Day, 1127 S Broad St, Wallingford, CT 06492"
    link = "https://maps.app.goo.gl/ksyeUdNPTS6EXGVD7"

# Enable or disable top bar with social icons
[params.topbar]
    enable = true
    text = """<p class="hidden-sm hidden-xs">Contact us at (860) 328-0585 or walter@newenglandsameday.com.</p>
      <p class="hidden-md hidden-lg"><a href="tel:+18603280585" data-animate-hover="pulse"><i class="fas fa-phone"></i></a>
      <a href="mailto:walter@newenglandsameday.com" data-animate-hover="pulse"><i class="fas fa-envelope"></i></a>
      </p>
      """

[params.carouselCustomers]
    items = 4
    auto_play = false
    slide_speed = 2000
    pagination_speed = 1000

[params.carouselTestimonials]
    items = 4
    auto_play = false
    slide_speed = 2000
    pagination_speed = 1000

[params.carouselHomepage]
    # All carousel items are defined in their own files. You can find example items
    # at 'exampleSite/data/carousel'.
    # For more information take a look at the README.
    enable = true
    auto_play = true
    slide_speed = 2000
    pagination_speed = 1000

[params.features]
    enable = true
    cols = 3 # Default: 3, Available values 2,3,4,6
    # All features are defined in their own files. You can find example items
    # at 'exampleSite/data/features'.
    # For more information take a look at the README.

[params.testimonials]
    enable = false
    # All testimonials are defined in their own files. You can find example items
    # at 'exampleSite/data/testimonials'.
    # For more information take a look at the README.
    title = "Testimonials"
    subtitle = "We have worked with many clients and we always like to hear they come out from the cooperation happy and satisfied. Have a look what our clients said about us."

[params.see_more]
    enable = true
    icon = "fas fa-phone"
    title = "Need one of our services?"
    subtitle = "Our couriers are available 24/7 for routed, scheduled, and STAT deliveries across the Northeast. Call us at (860) 328-0585."
    link_url = "contact/"
    link_text = "Contact Us"

[params.clients]
    enable = true
    # All clients are defined in their own files. You can find example items
    # at 'exampleSite/data/clients'.
    # For more information take a look at the README.
    title = "Our Clients"
    subtitle = ""
